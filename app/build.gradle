plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wanderstest3.termuxjavautils'
    compileSdk 34

    defaultConfig {
        applicationId "com.wanderstest3.termuxjavautils"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.0.6"
    }

    def storeFile = rootProject.file(System.getenv('TJU_KEYSTORE') ?: 'tju.jks')
    def readSecret = { String name ->
        def f = rootProject.file(name)
        f.exists() ? f.text.trim() : null
    }
    def storePass = System.getenv('TJU_STORE_PASSWORD') ?: readSecret('.store_password.txt')
    def keyPass = System.getenv('TJU_KEY_PASSWORD') ?: readSecret('.key_password.txt') ?: storePass
    def keyAlias = System.getenv('TJU_KEY_ALIAS') ?: readSecret('.key_alias.txt')

    signingConfigs {
        if (storeFile.exists() && storePass && keyAlias) {
            release {
                storeFile storeFile
                storePassword storePass
                keyAlias keyAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}
